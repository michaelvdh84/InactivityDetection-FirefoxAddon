<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="options.css">
</head>
<body>
<div class="options-form">
    <div class="options-time">
        <div class="options-field">
            <label>Show popup after :</label>
            <input type="number" access="false" id="modalAfter" min="1" disabled> seconds
        </div>
        <div class="options-field">
            <label>Popup life:&nbsp;</label>
            <input type="number" id="popupLife" min="1" disabled> seconds
        </div>
        <div class="options-field options-redirect">
            <label for="redirectUrl">Redirect URL:</label>
            <input type="url" id="redirectUrl" placeholder="https://portal.example.com/" disabled>
        </div>
        <div class="options-field options-toggle">
            <label for="kioskRestrictionsEnabled">Kiosk UI restrictions:</label>
            <input type="checkbox" id="kioskRestrictionsEnabled" disabled>
        </div>
        <div class="options-field options-kiosk-rules">
            <h2>Configured kiosk restriction rules</h2>
            <ul id="kioskRestrictionsSummary" aria-label="Configured kiosk restriction rules"></ul>
        </div>
    </div>
    <hr/>
    <div class="options-machine">
        <h2>Managed configuration</h2>
        <p id="managedConfigStatus" role="status" aria-live="polite"></p>
        <div class="options-field">
            <label for="hostname">Hostname:</label>
            <input type="text" id="hostname" readonly>
        </div>
        <div class="options-field">
            <label for="ip">IP:</label>
            <input type="text" id="ip" readonly>
        </div>
        <button type="button" id="unlockConfigBtn">Unlock configuration</button>
        <button type="button" id="useManagedValuesBtn">Use managed values</button>
    </div>
    <hr/>
    <div class="options-text">
        <div class="options-field options-language">
            <h2>FR:</h2>
            <label for="titleFR">Titre</label>
            <input type="text" id="titleFR" disabled>
            <label for="txtFR">Message</label>
            <textarea id="txtFR" disabled></textarea>
            <label for="btnQuitFR">Bouton Quitter</label>
            <input type="text" id="btnQuitFR" disabled>
            <label for="btnContinueFR">Bouton Continuer</label>
            <input type="text" id="btnContinueFR" disabled>
        </div>
        <div class="options-field options-language">
            <h2>NL:</h2>
            <label for="titleNL">Titel</label>
            <input type="text" id="titleNL" disabled>
            <label for="txtNL">Bericht</label>
            <textarea id="txtNL" disabled></textarea>
            <label for="btnQuitNL">Knop afsluiten</label>
            <input type="text" id="btnQuitNL" disabled>
            <label for="btnContinueNL">Knop doorgaan</label>
            <input type="text" id="btnContinueNL" disabled>
        </div>
        <div class="options-field options-language">
            <h2>EN:</h2>
            <label for="titleEN">Title</label>
            <input type="text" id="titleEN" disabled>
            <label for="txtEN">Message</label>
            <textarea id="txtEN" disabled></textarea>
            <label for="btnQuitEN">Exit button</label>
            <input type="text" id="btnQuitEN" disabled>
            <label for="btnContinueEN">Continue button</label>
            <input type="text" id="btnContinueEN" disabled>
        </div>
    </div>
    <br>
    <div>
        <button type="button" access="false" id="extTimeoutOptionbtn" disabled>Validate</button>
    </div>
</div>
<script src="options.js"></script>
</body>
</html>
